<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Talk — Team Scheduler</title>
<meta name="apple-mobile-web-app-title" content="Table Talk">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1D1B18">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231D1B18'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%23D4AF37'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --black:#1D1B18;
  --black-deep:#141210;
  --panel:#26221D;
  --panel-2:#2E2A23;
  --gold:#D4AF37;
  --gold-bright:#F0CC5E;
  --gold-soft:#B99A46;
  --ink:#F2EEE2;
  --ink-soft:#A6A08F;
  --line:#3C362C;
  --danger:#B84A3D;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--black);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--black);}

/* Header — rail of the table */
header.rail{
  background:linear-gradient(180deg,var(--black-deep) 0%, var(--panel) 100%);
  padding:22px 20px 18px;
  position:relative;
  border-bottom:2px solid var(--gold-soft);
}
header.rail::after{
  content:"";
  position:absolute;left:0;right:0;bottom:-6px;height:6px;
  background:repeating-linear-gradient(90deg, var(--gold) 0 10px, transparent 10px 26px);
  opacity:.55;
}
.title-row{display:flex;align-items:center;gap:10px;}
.title-row .dot{
  width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff8, transparent 45%), var(--gold);
  box-shadow:inset 0 0 0 2px #00000040;
  flex:0 0 auto;
}
h1{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  letter-spacing:.5px;
  color:var(--gold-bright);
  font-size:22px;
  margin:0;
  text-transform:uppercase;
}
.subtitle{
  color:var(--ink-soft);
  font-size:12.5px;
  margin-top:4px;
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.3px;
}

/* Playing-as bar */
.whoami{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);
}
.whoami label{color:var(--gold-soft);font-size:12px;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.whoami select{
  flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--gold-soft);
  background:var(--black-deep);color:var(--ink);font-family:'Inter';font-size:14px;font-weight:600;
}

/* Tabs */
.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);}
.tab{
  flex:1;text-align:center;padding:13px 8px;font-family:'Oswald',sans-serif;
  font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-soft);
  cursor:pointer;border-bottom:3px solid transparent;user-select:none;
}
.tab.active{color:var(--gold-bright);border-bottom-color:var(--gold);font-weight:600;}

main{padding:16px;}

/* Week nav */
.weeknav{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:10px 6px;margin-bottom:14px;
}
.weeknav button{
  background:var(--gold);color:var(--black-deep);border:none;width:36px;height:36px;border-radius:8px;
  font-size:16px;cursor:pointer;font-weight:700;
}
.weeknav .wk{
  text-align:center;font-family:'Oswald',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink);
}
.weeknav .wk small{display:block;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:11px;font-weight:500;margin-top:2px;}

/* Day cards */
.day{margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.day-head{
  padding:9px 14px;background:var(--gold);color:var(--black-deep);
  font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;
}
.slot{
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap;
}
.slot-label{width:98px;flex:0 0 auto;font-size:12.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
.slot-people{flex:1;display:flex;flex-wrap:wrap;gap:5px;min-height:26px;align-items:center;}
.ball{
  width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;font-family:'Inter';position:relative;flex:0 0 auto;
  box-shadow:inset 0 -3px 4px #00000030, inset 0 2px 2px #ffffff40;
}
.ball.stripe::after{
  content:"";position:absolute;left:2px;right:2px;top:8px;height:8px;background:#fff;border-radius:2px;opacity:.92;
}
.ball .num{position:relative;z-index:1;background:#fff;color:#111;width:12px;height:12px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:8px;}
.slot-toggle{
  flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);
  background:var(--black-deep);cursor:pointer;font-size:15px;color:var(--gold);
}
.slot-toggle.on{background:var(--gold);color:var(--black-deep);border-color:var(--gold);}
.slot.match{background:#2A2410;}
.slot.match .slot-label{color:var(--gold-bright);font-weight:700;}
.book-btn{
  flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 8px;border-radius:6px;
  border:1px solid var(--gold);background:transparent;color:var(--gold-bright);cursor:pointer;white-space:nowrap;
}
.booked-badge{
  flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 8px;border-radius:6px;
  background:var(--gold);color:var(--black-deep);font-weight:700;white-space:nowrap;
}
.cancel-btn{
  flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:5px 7px;border-radius:6px;
  border:1px solid var(--danger);background:transparent;color:#E8A79B;cursor:pointer;white-space:nowrap;
}

/* Roster / setup */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
.card h2{font-family:'Oswald';font-size:15px;text-transform:uppercase;margin:0 0 10px;color:var(--gold-bright);}
input[type=text], select, textarea{
  width:100%;padding:10px 11px;border-radius:8px;border:1.5px solid var(--line);
  font-family:'Inter';font-size:14px;background:var(--black-deep);color:var(--ink);
}
input[type=text]::placeholder, textarea::placeholder{color:var(--ink-soft);}
.btn{
  padding:10px 16px;border-radius:8px;border:1.5px solid var(--gold);background:transparent;color:var(--gold-bright);
  font-family:'Oswald';font-size:13px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;
}
.btn.gold{background:var(--gold);color:var(--black-deep);border-color:var(--gold);font-weight:600;}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
.row{display:flex;gap:8px;margin-top:10px;}
.row > *{flex:1;}
.roster-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.roster-chip{display:flex;align-items:center;gap:6px;background:var(--black-deep);border:1px solid var(--line);
  border-radius:20px;padding:5px 10px 5px 6px;font-size:13px;font-weight:600;color:var(--ink);}

/* Results */
.result-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;}
.result-top{display:flex;align-items:center;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
.result-mid{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 6px;}
.rp{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink);}
.vs{font-family:'Oswald';color:var(--gold);font-size:13px;}
.score{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--gold-bright);}
.result-actions{display:flex;justify-content:center;margin-top:8px;}
.copybtn{font-family:'IBM Plex Mono',monospace;font-size:11px;background:none;border:1px solid var(--line);
  border-radius:6px;padding:5px 9px;color:var(--gold-soft);cursor:pointer;}

.empty{text-align:center;padding:30px 14px;color:var(--ink-soft);font-size:13.5px;}
.empty b{display:block;color:var(--gold-bright);font-family:'Oswald';font-size:15px;margin-bottom:5px;text-transform:uppercase;}

/* Modal */
.overlay{position:fixed;inset:0;background:#000000cc;display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.modal{background:var(--panel);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:20px;border-top:2px solid var(--gold);position:relative;}
.modal h3{font-family:'Oswald';margin:0 0 12px;color:var(--gold-bright);text-transform:uppercase;font-size:16px;}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-family:'IBM Plex Mono',monospace;}
.check-row{display:flex;align-items:center;gap:8px;padding:7px 0;color:var(--ink);}
.venue-chips{display:flex;gap:8px;margin-bottom:8px;}
.venue-chip{
  flex:1;padding:8px 6px;text-align:center;border-radius:8px;border:1.5px solid var(--line);
  background:var(--black-deep);color:var(--ink-soft);font-size:12.5px;cursor:pointer;font-family:'IBM Plex Mono',monospace;
}
.venue-chip.active{border-color:var(--gold);color:var(--gold-bright);background:#2A2410;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const BALLS = [
  {n:1,color:'#F4C13B',stripe:false},{n:2,color:'#2C5FA8',stripe:false},{n:3,color:'#C43A3A',stripe:false},
  {n:4,color:'#6A3B96',stripe:false},{n:5,color:'#E2792E',stripe:false},{n:6,color:'#2E7D4F',stripe:false},
  {n:7,color:'#7A2E2E',stripe:false},{n:9,color:'#F4C13B',stripe:true},{n:10,color:'#2C5FA8',stripe:true},
  {n:11,color:'#C43A3A',stripe:true},{n:12,color:'#6A3B96',stripe:true}
];
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const TIMES = [
  {key:'morn', label:'Morning', sub:'6–9am'},
  {key:'latemorn', label:'Late Morning', sub:'9am–12pm'},
  {key:'aft', label:'Afternoon', sub:'12–5pm'},
  {key:'eve', label:'Evening', sub:'5–8pm'},
  {key:'ngt', label:'Night', sub:'8–11pm'}
];

let state = {
  roster: [],
  myName: null,
  weekOffset: 0,
  avail: {},
  bookings: {},
  results: [],
  tab: 'schedule',
  loaded: false,
  bookModal: null, // {slotKey}
  resultForm: false,
  notify: null // {kind:'confirmed'|'cancelled', players:[name], venue, day, timeLabel, dateLabel}
};

function findPlayer(name){
  return state.roster.find(p=>p.name===name);
}
function playerPhone(name){
  const p = findPlayer(name);
  return p ? (p.phone||'') : '';
}
function ballFor(name){
  const idx = state.roster.findIndex(p=>p.name===name);
  return BALLS[(idx<0?0:idx) % BALLS.length] || BALLS[0];
}
function Ball(name, size){
  const b = ballFor(name);
  const s = size||24;
  return `<span class="ball ${b.stripe?'stripe':''}" style="background:${b.color};width:${s}px;height:${s}px" title="${esc(name)}"><span class="num">${b.n}</span></span>`;
}
function esc(s){return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function waLink(phone, text){
  const digits = (phone||'').replace(/[^\d]/g,'');
  return digits ? `https://wa.me/${digits}?text=${encodeURIComponent(text)}` : `https://wa.me/?text=${encodeURIComponent(text)}`;
}

function getMonday(d){
  d = new Date(d);
  const day = d.getDay();
  const diff = d.getDate() - day + (day===0?-6:1);
  const m = new Date(d);
  m.setDate(diff);
  m.setHours(0,0,0,0);
  return m;
}
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function fmt(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function humanRange(monday){
  const sun = addDays(monday,6);
  const opts = {month:'short',day:'numeric'};
  return `${monday.toLocaleDateString('en-US',opts)} – ${sun.toLocaleDateString('en-US',opts)}`;
}
function currentWeekMonday(){
  return addDays(getMonday(new Date()), state.weekOffset*7);
}
function currentWeekStart(){
  return fmt(currentWeekMonday());
}

// ---------- Storage backend: Google Apps Script + Sheets (no Claude dependency) ----------
// Set this to your own /exec URL from Google Apps Script (see deployment notes at bottom of file).
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxug3n-ZNzDk2GPCPNb9zDPgDVaB2ZspwBIYYA6qCOrYplSlnQbyCY1DhOLrT-571o/exec';

function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function sget(key, shared, attempt){
  attempt = attempt||0;
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?key=${encodeURIComponent(key)}`);
    if(!res.ok) throw new Error('http '+res.status);
    const data = await res.json();
    state.syncIssue = false;
    return data && data.value ? JSON.parse(data.value) : null;
  }catch(e){
    if(attempt<2){ await wait(400); return sget(key, shared, attempt+1); }
    console.error('sheet get failed for', key, e);
    return null;
  }
}
async function sset(key, val, shared, attempt){
  attempt = attempt||0;
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({key, value: JSON.stringify(val)})
    });
    if(!res.ok) throw new Error('http '+res.status);
    state.syncIssue = false;
    return true;
  }catch(e){
    if(attempt<3){ await wait(400*(attempt+1)); return sset(key, val, shared, attempt+1); }
    console.error('sheet set failed for', key, e);
    state.syncIssue = true;
    render();
    return false;
  }
}



async function loadRoster(){
  const r = (await sget('roster', true)) || [];
  // migrate old string-array roster format to {name, phone}
  state.roster = r.map(item => typeof item === 'string' ? {name: item, phone:''} : item);
}
async function loadWeek(){
  const wk = currentWeekStart();
  state.avail = (await sget('avail:'+wk, true)) || {};
  state.bookings = (await sget('bookings:'+wk, true)) || {};
}
async function loadResults(){
  state.results = (await sget('results', true)) || [];
}
async function loadMe(){
  try{ state.myName = localStorage.getItem('table-talk-my-name') || null; }
  catch(e){ state.myName = null; }
}

const DEFAULT_ROSTER = ['Ephraim','Eric','Maria','Kurt','Lorna','Jason','Kayne','Tyrone','Emeric','Chris'].map(name=>({name, phone:''}));
const DEFAULT_VENUE = 'The Billiard House';
const DEFAULT_VENUE_URL = 'https://thebilliardhousemalta.com/booking/';

async function init(){
  await Promise.all([loadRoster(), loadMe(), loadResults()]);
  if(state.roster.length===0){
    state.roster = DEFAULT_ROSTER;
    await sset('roster', state.roster, true);
  }
  await loadWeek();
  state.loaded = true;
  render();
}

// ---------- Actions ----------
async function saveRoster(names){
  state.roster = names;
  await sset('roster', names, true);
  render();
}
async function pickMe(name){
  state.myName = name;
  try{ localStorage.setItem('table-talk-my-name', name); }catch(e){}
  render();
}
async function toggleSlot(slotKey){
  if(!state.myName) return;
  const wk = currentWeekStart();
  const list = state.avail[slotKey] ? [...state.avail[slotKey]] : [];
  const i = list.indexOf(state.myName);
  if(i>=0) list.splice(i,1); else list.push(state.myName);
  state.avail = {...state.avail, [slotKey]: list};
  render();
  await sset('avail:'+wk, state.avail, true);
}
function parseSlot(slotKey){
  const [day, tkey] = slotKey.split('-');
  const t = TIMES.find(x=>x.key===tkey);
  return {day, time: t};
}
function slotDateLabel(day){
  const monday = currentWeekMonday();
  const di = DAYS.indexOf(day);
  return addDays(monday, di).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
async function confirmBooking(slotKey, venue, players){
  const wk = currentWeekStart();
  state.bookings = {...state.bookings, [slotKey]: {venue, players, bookedBy: state.myName}};
  state.bookModal = null;
  const {day, time} = parseSlot(slotKey);
  const dateLabel = slotDateLabel(day);
  const text = `🎱 Match confirmed: ${players[0]} vs ${players[1]} — ${day} ${dateLabel}, ${time.label} (${time.sub}) at ${venue}. See you there!`;
  state.notify = {kind:'confirmed', players, text};
  render();
  await sset('bookings:'+wk, state.bookings, true);
}
async function cancelBooking(slotKey){
  const wk = currentWeekStart();
  const booking = state.bookings[slotKey];
  const updated = {...state.bookings};
  delete updated[slotKey];
  state.bookings = updated;
  if(booking){
    const {day, time} = parseSlot(slotKey);
    const dateLabel = slotDateLabel(day);
    const text = `❌ Match cancelled: ${booking.players.join(' vs ')} — ${day} ${dateLabel}, ${time.label}. That slot's open again if anyone wants it.`;
    state.notify = {kind:'cancelled', players: booking.players, text};
  }
  render();
  await sset('bookings:'+wk, state.bookings, true);
}
async function addResult(r){
  const rec = {...r, id: Date.now()+'', date: new Date().toISOString().slice(0,10)};
  const list = [rec, ...state.results];
  state.results = list;
  state.resultForm = false;
  render();
  await sset('results', list, true);
}

// ---------- Render ----------
function render(){
  const el = document.getElementById('app');
  if(!state.loaded){ el.innerHTML = `<div class="empty">Loading…</div>`; return; }

  el.innerHTML = `
    <header class="rail">
      <div class="title-row"><span class="dot"></span><h1>Table Talk</h1></div>
      <div class="subtitle">TEAM AVAILABILITY &amp; MATCH LOG</div>
    </header>
    ${renderWhoAmI()}
    ${state.syncIssue ? `<div style="background:#3A1E1E;color:#E8A79B;font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:9px 16px;text-align:center;">Having trouble syncing to the team — keep going, it'll retry in the background.</div>` : ''}
    ${state.roster.length===0 ? '' : renderTabs()}
    <main>
      ${state.roster.length===0 ? renderSetup() : (state.tab==='schedule' ? renderSchedule() : (state.tab==='results' ? renderResults() : renderRosterTab()))}
    </main>
    ${state.bookModal ? renderBookModal() : ''}
    ${state.resultForm ? renderResultModal() : ''}
    ${state.notify ? renderNotifyPanel() : ''}
  `;
  wireEvents();
}

function renderWhoAmI(){
  if(state.roster.length===0) return '';
  if(state.addingName){
    return `
      <div class="whoami" style="flex-wrap:wrap;">
        <label>YOUR NAME</label>
        <input type="text" id="new-name-input" placeholder="Type your name…" style="flex:1;min-width:120px;padding:8px 10px;border-radius:8px;border:1px solid var(--gold-soft);font-size:14px;">
        <input type="text" id="new-phone-input" placeholder="WhatsApp number (optional)" style="flex:1;min-width:150px;padding:8px 10px;border-radius:8px;border:1px solid var(--gold-soft);font-size:14px;">
        <button class="btn gold" id="new-name-save" style="padding:8px 12px;">Add</button>
      </div>`;
  }
  return `
    <div class="whoami">
      <label>PLAYING AS</label>
      <select id="who-select">
        <option value="">Select your name…</option>
        ${state.roster.map(p=>`<option value="${esc(p.name)}" ${p.name===state.myName?'selected':''}>${esc(p.name)}</option>`).join('')}
        <option value="__add__">+ Add my name…</option>
      </select>
    </div>`;
}

function renderTabs(){
  return `
    <div class="tabs">
      <div class="tab ${state.tab==='schedule'?'active':''}" data-tab="schedule">Schedule</div>
      <div class="tab ${state.tab==='results'?'active':''}" data-tab="results">Results</div>
      <div class="tab ${state.tab==='roster'?'active':''}" data-tab="roster">Roster</div>
    </div>`;
}

function renderSetup(){
  return `
    <div class="card">
      <h2>Set up your team</h2>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 10px;">Add all 11 players, one per line. Everyone shares this same link.</p>
      <textarea id="roster-input" rows="8" placeholder="Alice&#10;Bob&#10;Carlos&#10;..."></textarea>
      <div class="row"><button class="btn" id="save-roster">Save Roster</button></div>
    </div>`;
}

function renderRosterTab(){
  return `
    <div class="card">
      <h2>Team Roster</h2>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;">Add each player's WhatsApp number so booking &amp; cancellation notices can reach them directly. Use full international format, e.g. +35699112233.</p>
      ${state.roster.map((p,i)=>`
        <div class="check-row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;">
          <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto;">${Ball(p.name,22)}<b>${esc(p.name)}</b></div>
          <input type="text" class="roster-phone" data-idx="${i}" value="${esc(p.phone||'')}" placeholder="+356…" style="flex:1;margin:0 8px;padding:7px 9px;font-size:13px;">
          <button class="cancel-btn" data-remove-player="${i}">Remove</button>
        </div>`).join('')}
    </div>
    <div class="card">
      <h2>Add a Player</h2>
      <div class="field"><label>NAME</label><input type="text" id="add-player-name" placeholder="Player name"></div>
      <div class="field"><label>WHATSAPP NUMBER (optional)</label><input type="text" id="add-player-phone" placeholder="+35699112233"></div>
      <button class="btn gold" id="add-player-btn" style="width:100%;">Add Player</button>
    </div>`;
}

function renderSchedule(){
  if(!state.myName){
    return `<div class="empty"><b>Pick your name up top</b>Choose who you are so we know whose availability to save.</div>`;
  }
  const wk = currentWeekStart();
  const monday = currentWeekMonday();
  let html = `
    <div class="weeknav">
      <button data-nav="-1">‹</button>
      <div class="wk">${state.weekOffset===0?'This Week':(state.weekOffset===1?'Next Week':humanRange(monday))}<small>${humanRange(monday)}</small></div>
      <button data-nav="1">›</button>
    </div>`;

  DAYS.forEach((day,di)=>{
    const dDate = addDays(monday, di);
    const dateLabel = dDate.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    html += `<div class="day"><div class="day-head">${day} <span style="opacity:.75;font-weight:500;">· ${dateLabel}</span></div>`;
    TIMES.forEach(t=>{
      const slotKey = `${day}-${t.key}`;
      const people = state.avail[slotKey] || [];
      const booking = state.bookings[slotKey];
      const isMatch = people.length>=2;
      const iAmIn = people.includes(state.myName);
      html += `
        <div class="slot ${isMatch?'match':''}">
          <div class="slot-label">${t.label}<br><span style="opacity:.7">${t.sub}</span></div>
          <div class="slot-people">
            ${people.map(p=>Ball(p)).join('') || '<span style="color:var(--ink-soft);font-size:12px;">—</span>'}
          </div>
          ${booking
            ? `<span style="display:flex;gap:6px;align-items:center;">
                ${booking.venue===DEFAULT_VENUE
                  ? `<a class="booked-badge" href="${DEFAULT_VENUE_URL}" target="_blank" rel="noopener" style="text-decoration:none;">✓ ${esc(booking.venue)} ↗</a>`
                  : `<span class="booked-badge">✓ ${esc(booking.venue)}</span>`}
                <button class="cancel-btn" data-cancel="${slotKey}">${state.cancelConfirm===slotKey?'Tap to confirm':'Cancel'}</button>
              </span>`
            : (isMatch ? `<button class="book-btn" data-book="${slotKey}">Book</button>` : '')
          }
          <button class="slot-toggle ${iAmIn?'on':''}" data-toggle="${slotKey}">${iAmIn?'✓':'+'}</button>
        </div>`;
    });
    html += `</div>`;
  });
  return html;
}

function renderResults(){
  let html = `<div class="row" style="margin-bottom:14px;"><button class="btn gold" id="open-result-form">+ Log a Result</button></div>`;
  if(state.results.length===0){
    html += `<div class="empty"><b>No results yet</b>Once you play a match, log it here to build the ranking history.</div>`;
    return html;
  }
  state.results.forEach(r=>{
    const winnerBall = ballFor(r.winner);
    html += `
      <div class="result-card">
        <div class="result-top"><span>${r.date}</span>${r.note?`<span>${esc(r.note)}</span>`:''}</div>
        <div class="result-mid">
          <div class="rp">${Ball(r.p1,30)}${esc(r.p1)}</div>
          <div class="vs">VS</div>
          <div class="rp">${Ball(r.p2,30)}${esc(r.p2)}</div>
        </div>
        <div class="score">${esc(r.score||'')}</div>
        <div style="text-align:center;font-size:12px;color:var(--gold);font-weight:700;margin-top:4px;">🏆 ${esc(r.winner)}</div>
        <div class="result-actions">
          <button class="copybtn" data-copy="${r.id}">Copy to share</button>
        </div>
      </div>`;
  });
  return html;
}

function renderBookModal(){
  const slotKey = state.bookModal;
  const people = state.avail[slotKey] || [];
  const venueMode = state.venueMode || 'default'; // 'default' | 'other'
  return `
    <div class="overlay" id="overlay">
      <div class="modal">
        <button class="close-x" data-close-modal>✕</button>
        <h3>Book This Match</h3>
        <div class="field">
          <label>WHO'S PLAYING</label>
          ${people.map(p=>`
            <div class="check-row">
              <input type="checkbox" class="book-player" value="${esc(p)}" ${people.length===2?'checked disabled':''}>
              ${Ball(p,20)} ${esc(p)}
            </div>`).join('')}
        </div>
        <div class="field">
          <label>VENUE</label>
          <div class="venue-chips">
            <div class="venue-chip ${venueMode==='default'?'active':''}" data-venue-mode="default">${esc(DEFAULT_VENUE)}</div>
            <div class="venue-chip ${venueMode==='other'?'active':''}" data-venue-mode="other">Other venue</div>
          </div>
          <input type="text" id="venue-input" value="${venueMode==='default'?esc(DEFAULT_VENUE):esc(state.customVenue||'')}" ${venueMode==='default'?'readonly':''} placeholder="${venueMode==='other'?'Type venue name…':''}">
          ${venueMode==='default' ? `<a href="${DEFAULT_VENUE_URL}" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;font-size:12.5px;color:var(--gold-bright);font-family:'IBM Plex Mono',monospace;">Book a table at ${esc(DEFAULT_VENUE)} ↗</a>` : ''}
        </div>
        <button class="btn gold" id="confirm-book" style="width:100%;">Confirm Booking</button>
        ${state.formError ? `<div style="color:#E8A79B;font-size:12.5px;margin-top:8px;text-align:center;font-family:'IBM Plex Mono',monospace;">${esc(state.formError)}</div>` : ''}
      </div>
    </div>`;
}

function renderNotifyPanel(){
  const n = state.notify;
  const title = n.kind==='confirmed' ? 'Booking Confirmed 🎱' : 'Booking Cancelled';
  return `
    <div class="overlay" id="overlay">
      <div class="modal">
        <button class="close-x" data-close-notify>✕</button>
        <h3>${title}</h3>
        <p style="font-size:13px;color:var(--ink-soft);margin:0 0 14px;">${esc(n.text)}</p>
        <div class="field">
          <label>NOTIFY PLAYERS</label>
          ${n.players.map(name=>{
            const phone = playerPhone(name);
            return `<a class="btn" style="display:block;text-align:center;margin-bottom:8px;text-decoration:none;" href="${waLink(phone, n.text)}" target="_blank" rel="noopener">
              WhatsApp ${esc(name)}${phone?'':' (no number saved)'}
            </a>`;
          }).join('')}
        </div>
        <div class="field">
          <label>OR</label>
          <a class="btn gold" style="display:block;text-align:center;text-decoration:none;" href="${waLink('', n.text)}" target="_blank" rel="noopener">Share to Team Group Chat</a>
        </div>
      </div>
    </div>`;
}

function renderResultModal(){
  return `
    <div class="overlay" id="overlay">
      <div class="modal">
        <button class="close-x" data-close-modal>✕</button>
        <h3>Log a Result</h3>
        <div class="field"><label>PLAYER 1</label>
          <select id="r-p1"><option value="">Select…</option>${state.roster.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>PLAYER 2</label>
          <select id="r-p2"><option value="">Select…</option>${state.roster.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>SCORE</label>
          <input type="text" id="r-score" placeholder="e.g. 7–4">
        </div>
        <div class="field"><label>WINNER</label>
          <select id="r-winner"><option value="">Select…</option>${state.roster.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>NOTE (optional)</label>
          <input type="text" id="r-note" placeholder="e.g. Week 3 — Rack & Cue">
        </div>
        <button class="btn gold" id="confirm-result" style="width:100%;">Save Result</button>
        ${state.formError ? `<div style="color:#E8A79B;font-size:12.5px;margin-top:8px;text-align:center;font-family:'IBM Plex Mono',monospace;">${esc(state.formError)}</div>` : ''}
      </div>
    </div>`;
}

function wireEvents(){
  const who = document.getElementById('who-select');
  if(who) who.onchange = e=>{
    if(e.target.value==='__add__'){ state.addingName = true; render(); return; }
    pickMe(e.target.value);
  };
  const newNameSave = document.getElementById('new-name-save');
  if(newNameSave) newNameSave.onclick = async ()=>{
    const input = document.getElementById('new-name-input');
    const phoneInput = document.getElementById('new-phone-input');
    const name = input.value.trim();
    const phone = phoneInput ? phoneInput.value.trim() : '';
    if(!name) return;
    if(!state.roster.some(p=>p.name===name)){
      state.roster = [...state.roster, {name, phone}];
      await sset('roster', state.roster, true);
    }
    state.addingName = false;
    await pickMe(name);
  };

  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{ state.tab = t.dataset.tab; render(); };
  });

  document.querySelectorAll('[data-toggle]').forEach(b=>{
    b.onclick = ()=> toggleSlot(b.dataset.toggle);
  });
  document.querySelectorAll('[data-nav]').forEach(b=>{
    b.onclick = async ()=>{ state.weekOffset += parseInt(b.dataset.nav,10); await loadWeek(); render(); };
  });
  document.querySelectorAll('[data-book]').forEach(b=>{
    b.onclick = ()=>{ state.bookModal = b.dataset.book; state.venueMode = 'default'; state.formError = null; render(); };
  });
  document.querySelectorAll('[data-cancel]').forEach(b=>{
    b.onclick = ()=>{
      const slotKey = b.dataset.cancel;
      if(state.cancelConfirm===slotKey){
        state.cancelConfirm = null;
        cancelBooking(slotKey);
      } else {
        state.cancelConfirm = slotKey;
        render();
        setTimeout(()=>{ if(state.cancelConfirm===slotKey){ state.cancelConfirm=null; render(); } }, 4000);
      }
    };
  });
  document.querySelectorAll('[data-venue-mode]').forEach(b=>{
    b.onclick = ()=>{
      const input = document.getElementById('venue-input');
      if(input && state.venueMode==='other') state.customVenue = input.value;
      state.venueMode = b.dataset.venueMode;
      render();
    };
  });
  document.querySelectorAll('[data-copy]').forEach(b=>{
    b.onclick = ()=>{
      const r = state.results.find(x=>x.id===b.dataset.copy);
      if(!r) return;
      const text = `🎱 ${r.p1} vs ${r.p2} — ${r.score||''} — Winner: ${r.winner} (${r.date})${r.note? ' — '+r.note:''}`;
      navigator.clipboard.writeText(text).then(()=>{
        b.textContent = 'Copied!'; setTimeout(()=> b.textContent='Copy to share', 1500);
      });
    };
  });

  const saveRosterBtn = document.getElementById('save-roster');
  if(saveRosterBtn) saveRosterBtn.onclick = ()=>{
    const raw = document.getElementById('roster-input').value;
    const names = raw.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,20);
    if(names.length) saveRoster(names.map(name=>({name, phone:''})));
  };

  document.querySelectorAll('.roster-phone').forEach(inp=>{
    inp.onchange = async ()=>{
      const idx = parseInt(inp.dataset.idx,10);
      const updated = state.roster.map((p,i)=> i===idx ? {...p, phone: inp.value.trim()} : p);
      state.roster = updated;
      await sset('roster', state.roster, true);
    };
  });
  document.querySelectorAll('[data-remove-player]').forEach(b=>{
    b.onclick = async ()=>{
      const idx = parseInt(b.dataset.removePlayer,10);
      state.roster = state.roster.filter((_,i)=> i!==idx);
      render();
      await sset('roster', state.roster, true);
    };
  });
  const addPlayerBtn = document.getElementById('add-player-btn');
  if(addPlayerBtn) addPlayerBtn.onclick = async ()=>{
    const nameInput = document.getElementById('add-player-name');
    const phoneInput = document.getElementById('add-player-phone');
    const name = nameInput.value.trim();
    const phone = phoneInput.value.trim();
    if(!name) return;
    if(!state.roster.some(p=>p.name===name)){
      state.roster = [...state.roster, {name, phone}];
      render();
      await sset('roster', state.roster, true);
    }
  };

  const openResultForm = document.getElementById('open-result-form');
  if(openResultForm) openResultForm.onclick = ()=>{ state.resultForm = true; state.formError = null; render(); };

  document.querySelectorAll('[data-close-modal]').forEach(b=>{
    b.onclick = ()=>{ state.bookModal=null; state.resultForm=false; state.venueMode=null; state.customVenue=null; state.formError=null; render(); };
  });
  document.querySelectorAll('[data-close-notify]').forEach(b=>{
    b.onclick = ()=>{ state.notify=null; render(); };
  });
  const overlay = document.getElementById('overlay');
  if(overlay) overlay.addEventListener('click', e=>{ if(e.target.id==='overlay'){ state.bookModal=null; state.resultForm=false; state.venueMode=null; state.customVenue=null; state.formError=null; state.notify=null; render(); }});

  const confirmBook = document.getElementById('confirm-book');
  if(confirmBook) confirmBook.onclick = ()=>{
    const venue = document.getElementById('venue-input').value.trim() || 'TBD';
    const checked = [...document.querySelectorAll('.book-player:checked')].map(c=>c.value);
    if(checked.length<2){ state.formError = 'Pick two players.'; render(); return; }
    state.venueMode = null; state.customVenue = null; state.formError = null;
    confirmBooking(state.bookModal, venue, checked.slice(0,2));
  };

  const confirmResult = document.getElementById('confirm-result');
  if(confirmResult) confirmResult.onclick = ()=>{
    const p1 = document.getElementById('r-p1').value;
    const p2 = document.getElementById('r-p2').value;
    const score = document.getElementById('r-score').value.trim();
    const winner = document.getElementById('r-winner').value;
    const note = document.getElementById('r-note').value.trim();
    if(!p1||!p2||!winner){ state.formError = 'Fill in both players and the winner.'; render(); return; }
    state.formError = null;
    addResult({p1,p2,score,winner,note});
  };
}

// override roster tab render hook
const _origRenderSchedule = renderSchedule;
init();
</script>

TABLE TALK — STANDALONE DEPLOYMENT NOTES
=====================================================================
This file has ZERO dependency on Claude/Anthropic. It's a plain
static HTML/CSS/JS page. Host it anywhere that serves static files:
GitHub Pages, Netlify, Vercel, Cloudflare Pages, an S3 bucket, etc.

DATA BACKEND
This app stores all shared data (roster, availability, bookings,
results) in a Google Sheet via a Google Apps Script web app acting
as a tiny free REST API. That's the APPS_SCRIPT_URL constant near
the top of the <script> block.

If you ever need to redeploy the Apps Script backend from scratch:
1. Go to script.google.com -> New project
2. Paste in the Apps Script below
3. Deploy -> New deployment -> Web app -> Execute as: Me,
   Who has access: Anyone
4. Copy the resulting /exec URL into APPS_SCRIPT_URL in this file

--- Apps Script source (doGet/doPost) ---
function getSheet() {
  const props = PropertiesService.getScriptProperties();
  let id = props.getProperty('SHEET_ID');
  let ss;
  if (id) {
    ss = SpreadsheetApp.openById(id);
  } else {
    ss = SpreadsheetApp.create('Table Talk Data');
    props.setProperty('SHEET_ID', ss.getId());
  }
  let sheet = ss.getSheetByName('KV');
  if (!sheet) {
    sheet = ss.getSheets()[0];
    sheet.setName('KV');
  }
  return sheet;
}
function doGet(e) {
  const key = e.parameter.key;
  const sheet = getSheet();
  const data = sheet.getDataRange().getValues();
  for (let i = 0; i < data.length; i++) {
    if (data[i][0] === key) {
      return ContentService.createTextOutput(JSON.stringify({key: key, value: data[i][1]}))
        .setMimeType(ContentService.MimeType.JSON);
    }
  }
  return ContentService.createTextOutput(JSON.stringify({key: key, value: null}))
    .setMimeType(ContentService.MimeType.JSON);
}
function doPost(e) {
  const lock = LockService.getScriptLock();
  lock.waitLock(10000);
  try {
    const body = JSON.parse(e.postData.contents);
    const key = body.key;
    const value = body.value;
    const sheet = getSheet();
    const data = sheet.getDataRange().getValues();
    for (let i = 0; i < data.length; i++) {
      if (data[i][0] === key) {
        sheet.getRange(i + 1, 2).setValue(value);
        return ContentService.createTextOutput(JSON.stringify({ok: true})).setMimeType(ContentService.MimeType.JSON);
      }
    }
    sheet.appendRow([key, value]);
    return ContentService.createTextOutput(JSON.stringify({ok: true})).setMimeType(ContentService.MimeType.JSON);
  } finally {
    lock.releaseLock();
  }
}

FEATURES THAT USED CLAUDE'S ARTIFACT API (NOW REPLACED)

   Now: fetch() to the Apps Script URL above (free, works anywhere)
2. "Playing as" (per-device remembered name)
   Was: window.storage.get()/set(key, val, shared=false)
   Now: plain browser localStorage (not allowed inside Claude
        artifacts, but fine on a normal hosted page)

No other Claude-specific APIs, tools, or branding are used anywhere
in this file.
